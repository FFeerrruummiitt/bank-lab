apiVersion: 1
datasources:
  - name: Bank Lab Loki
    uid: banklab-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          datasourceUid: banklab-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Открыть трассу
  - name: Bank Lab Tempo
    uid: banklab-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: banklab-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{service="bank-api"} | json | trace_id = "$${__trace.traceId}"'
