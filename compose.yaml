name: bank-lab
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banklab
      POSTGRES_USER: banklab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
    volumes:
      - bank-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklab -d banklab"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      POSTGRES_DB: banklab
      POSTGRES_USER: banklab
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Create .env first}
      ENABLE_TEST_TOPUP: ${ENABLE_TEST_TOPUP:-true}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bank-data:
